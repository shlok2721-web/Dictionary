name: Valgrind 30-minute soak test

on:
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: "Minutes to keep the app running under valgrind"
        default: "30"
      fail_on_leak:
        description: "Fail the job if a leak/error is found in project code"
        type: boolean
        default: false
  push:
    branches: [main, master]
  pull_request:

# One soak run per ref; a newer push cancels the older (30 min) run.
concurrency:
  group: valgrind-${{ github.ref }}
  cancel-in-progress: true

env:
  DURATION_MIN: ${{ github.event.inputs.duration_minutes || '30' }}

jobs:
  build:
    name: Compile
    runs-on: ubuntu-latest
    # AdwWrapBox (used by the UI) needs libadwaita >= 1.7; Ubuntu 24.04 only has 1.5.
    container: ubuntu:25.10
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git curl build-essential pkg-config meson ninja-build \
            libxml2-utils libglib2.0-dev-bin \
            libgtk-4-dev libadwaita-1-dev libjson-glib-dev libsqlite3-dev libglib2.0-dev \
            libwayland-dev wayland-protocols
          apt-get install -y --no-install-recommends gobject-introspection libgirepository1.0-dev \
            || apt-get install -y --no-install-recommends gobject-introspection libgirepository-2.0-dev || true
          apt-get install -y --no-install-recommends valac || true
          pkg-config --modversion libadwaita-1

      - uses: actions/checkout@v4

      - name: Build gtk4-layer-shell (no apt package for GTK4)
        run: |
          git clone --depth 1 --branch v1.0.4 https://github.com/wmww/gtk4-layer-shell.git /tmp/gls
          cd /tmp/gls
          meson setup build --prefix=/opt/layer-shell -Dexamples=false -Ddocs=false -Dtests=false
          ninja -C build
          ninja -C build install
          find /opt/layer-shell -name 'gtk4-layer-shell.h' -o -name 'libgtk4-layer-shell.so*' -o -name '*.pc'

      - name: Compile (debug info, light optimisation for readable valgrind stacks)
        run: |
          PC=$(find /opt/layer-shell -name 'gtk4-layer-shell-0.pc' -printf '%h\n' | head -n1)
          LSLIB=$(find /opt/layer-shell -name 'libgtk4-layer-shell.so' -printf '%h\n' | head -n1)
          export PKG_CONFIG_PATH="$PC"
          mkdir -p build
          glib-compile-resources --sourcedir=data --target=build/resources.c --generate-source \
            data/dev.silvanus.dictionary.gresource.xml
          # The .pc file only adds -I.../include/gtk4-layer-shell, but the source includes
          # <gtk4-layer-shell/gtk4-layer-shell.h>, so add the parent include dir explicitly.
          gcc -std=gnu11 -O1 -g -fno-omit-frame-pointer -Wall -Isrc -I/opt/layer-shell/include \
            src/base.c src/clipboard_watch.c src/database.c src/espeak_lib.c src/main.c \
            src/popup_window.c src/search_completion.c src/settings.c src/settings_window.c \
            src/tray.c src/utils.c src/window.c build/resources.c \
            -o build/dictionary \
            -L"$LSLIB" -Wl,-rpath,"$LSLIB" \
            $(pkg-config --cflags --libs gtk4-layer-shell-0 gtk4 libadwaita-1 json-glib-1.0 sqlite3) \
            -ldl -lm
          test -x build/dictionary

      - name: Bundle binary + layer-shell
        run: tar czf dictionary-bundle.tgz build/dictionary /opt/layer-shell

      - uses: actions/upload-artifact@v4
        with:
          name: dictionary-binary
          path: dictionary-bundle.tgz
          retention-days: 2

  valgrind:
    name: Valgrind (${{ matrix.scenario }})
    needs: build
    runs-on: ubuntu-latest
    container: ubuntu:25.10
    timeout-minutes: 90
    env:
      DEBIAN_FRONTEND: noninteractive
    strategy:
      fail-fast: false
      matrix:
        scenario: [window, background]   # window = open UI under load, background = tray/headless service
    steps:
      - name: Install runtime dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git curl tar valgrind xvfb xauth xdotool dbus dbus-x11 dbus-bin \
            libgtk-4-1 libadwaita-1-0 libjson-glib-1.0-0 libsqlite3-0 libwayland-client0 \
            espeak-ng python3 libgl1-mesa-dri adwaita-icon-theme fonts-dejavu-core procps

      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dictionary-binary

      - name: Unpack binary and layer-shell
        run: |
          tar xzf dictionary-bundle.tgz            # build/dictionary into the workspace
          tar xzf dictionary-bundle.tgz -C / opt   # /opt/layer-shell

      - name: Prepare isolated HOME and the database
        env:
          KRUMETO_DB_URL: ${{ vars.KRUMETO_DB_URL }}   # optional repo variable: direct link to the real .db
        run: |
          chmod +x build/dictionary .github/scripts/*  # (paths are relative to the workspace)
          VER=$(sed -n 's/^#define[[:space:]]\+WN_FILE_VERSION[[:space:]]\+"\([^"]*\)".*/\1/p' src/constants.h | head -n1)
          DB="krumeto-${VER}.db"
          export HOME="$RUNNER_TEMP/home"; mkdir -p "$HOME/.local/share/dictionary" "$HOME/.config/dictionary"
          DEST="$HOME/.local/share/dictionary/$DB"
          if   [ -s "data/$DB" ];            then cp "data/$DB" "$DEST";                     echo "DB_SOURCE=repo" >> $GITHUB_ENV
          elif [ -n "${KRUMETO_DB_URL:-}" ]; then curl -fL --retry 3 -o "$DEST" "$KRUMETO_DB_URL"; echo "DB_SOURCE=download" >> $GITHUB_ENV
          else python3 .github/scripts/make_test_db.py "$DEST" 20000;                     echo "DB_SOURCE=synthetic" >> $GITHUB_ENV
          fi
          head -c 15 "$DEST" | grep -q "SQLite format 3"
          echo "HOME=$HOME" >> $GITHUB_ENV
          echo "XDG_DATA_HOME=$HOME/.local/share" >> $GITHUB_ENV
          echo "XDG_CONFIG_HOME=$HOME/.config" >> $GITHUB_ENV
          ls -la "$HOME/.local/share/dictionary"

      - name: Run application under valgrind for ${{ env.DURATION_MIN }} minutes
        env:
          SCENARIO: ${{ matrix.scenario }}
          BIN: build/dictionary
          OUT: valgrind-logs
        run: |
          export LD_LIBRARY_PATH=$(find /opt/layer-shell -name 'libgtk4-layer-shell.so' -printf '%h\n' | head -n1):${LD_LIBRARY_PATH:-}
          # Virtual display + private session bus for the whole test; the app stays
          # running (and is poked every ~10-30 s) until the time is up.
          xvfb-run -a -s "-screen 0 1280x800x24" \
            dbus-run-session -- bash .github/scripts/run_valgrind_session.sh

      - name: Summarise leaks
        if: always()
        run: |
          {
            echo "## Valgrind — ${{ matrix.scenario }} (${DURATION_MIN} min, database: ${DB_SOURCE:-?})"
            echo '```'; cat valgrind-logs/session-${{ matrix.scenario }}.txt 2>/dev/null; echo '```'
            echo '### Valgrind LEAK SUMMARY (all code, includes GTK/GLib noise)'
            echo '```'; grep -A8 "LEAK SUMMARY" valgrind-logs/valgrind-${{ matrix.scenario }}.log 2>/dev/null || echo "no summary (run did not finish)"; echo '```'
            python3 .github/scripts/summarize_valgrind.py valgrind-logs/valgrind-${{ matrix.scenario }}.xml || true
          } >> "$GITHUB_STEP_SUMMARY"
          # Enforce only when asked.
          if [ "${{ github.event.inputs.fail_on_leak }}" = "true" ]; then
            python3 .github/scripts/summarize_valgrind.py valgrind-logs/valgrind-${{ matrix.scenario }}.xml --fail-on-project-leak >/dev/null
          fi

      - name: Upload valgrind logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: valgrind-logs-${{ matrix.scenario }}
          path: valgrind-logs/
          if-no-files-found: warn
          retention-days: 30
